    // Заставка: перший візит — «креслення» логотипа; перезавантаження / зміна мови — коротке «Завантаження…»
    try {
      const forceIntro = new URLSearchParams(location.search).has("intro"); // ?intro — завжди повна заставка
      const html = document.documentElement;
      if ("scrollRestoration" in history) history.scrollRestoration = "manual";   // самі вирішуємо, куди скролити
      if (matchMedia("(prefers-reduced-motion: reduce)").matches && !forceIntro) html.classList.add("no-loader");
      else {
        html.classList.add("loader-active");                                        // поки заставка — курсор схований
        if (!forceIntro && (sessionStorage.getItem("seenLoader") || window.name === "seenLoader")) html.classList.add("loader-short");
        else html.classList.add("loader-draft");
      }
      // ?intro спрацьовує один раз — прибираємо його з адреси, щоб перезавантаження показувало «Завантаження…»
      if (forceIntro) { const u = new URL(location.href); u.searchParams.delete("intro"); history.replaceState(null, "", u); }
    } catch (e) {}
  </script>

  <script>
    // ---- Збирає сторінку з content.js (тут нічого міняти не треба) ----
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const pad = i => String(i + 1).padStart(2, "0");
    const finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;

    $("available").textContent = site.available;
    $("intro").textContent = site.tagline || ""; if (!site.tagline) $("intro").hidden = true;
    $("about-text").textContent = site.intro;
    $("foot-name").textContent = "© " + new Date().getFullYear() + " " + site.name;
    $("foot-loc").textContent = site.location;
    $("projects-count").textContent = site.projects.length + T.projects_word + site.role;

    // Анімований заголовок: кожне слово виїжджає знизу по черзі
    const words = site.headline.split(" ");
    $("headline").innerHTML = words.map((w, i) => `<span class="w"><span style="--i:${i}">${esc(w)}</span></span>`).join(" ");
    const afterTitle = (words.length * 70 + 500) / 1000;
    $("intro").style.setProperty("--d", afterTitle + "s");
    $("hero-meta").style.setProperty("--d", (afterTitle + .15) + "s");

    // Біжучий рядок
    const mq = (site.marquee || []).map(m => {
      const t = typeof m === "string" ? { text: m } : m;
      const p = t.project && site.projects.find(x => x.slug === t.project);
      return (p ? `<a href="#p-${esc(p.slug)}" title="${esc(p.title)}">${esc(t.text)}</a>` : `<span>${esc(t.text)}</span>`) + `<i>✦</i>`;
    }).join("");
    $("marquee").innerHTML = [mq, mq, mq, mq].map((h, k) => k ? h.replace(/<a /g, '<a tabindex="-1" ') : h).join("");

    // Лічильники
    $("stats").innerHTML = (site.stats || []).map(s => `
      <div class="stat"><div class="n"><span data-to="${+s.value}">0</span><em>${esc(s.suffix)}</em></div>
      <p>${esc(s.label)}</p></div>`).join("");

    const mock = `<div class="mock"><div class="win"><div class="bar"><i></i><i></i><i></i></div>
      <div class="body"><div class="side"><b></b><b></b><b style="width:70%"></b><b></b></div>
      <div class="main"><b style="width:45%;height:12px"></b><div class="cards"><div></div><div></div><div></div></div>
      <div class="chart"></div><b></b><b style="width:80%"></b></div></div></div></div>`;

    const chatMock = `<div class="mock"><div class="phone"><div class="ph-top"><i></i><div><b></b><b style="width:50%"></b></div></div>

        let drawLang = null; try { drawLang = sessionStorage.getItem("drawLang"); sessionStorage.removeItem("drawLang"); } catch (e) {}
        const TOTAL = drawLang ? 1450 : 1100;
        const glowLine = () => { ctx.strokeStyle = ACC; ctx.shadowColor = ACC; ctx.shadowBlur = 8; ctx.lineWidth = 2; ctx.lineCap = "round"; ctx.lineJoin = "round"; };

        // літери «UA» / «EN» — суцільні фігури в стилі j13 (товсті штрихи, скошені кути): промінь обводить контур, потім заливка
        let strokes = null, shapes = null;
        const TXT = css.getPropertyValue("--text").trim() || "#e4e4dc";
        if (drawLang) {
          const G = {
            U: [[[0,0],[16,0],[16,64],[48,64],[48,0],[64,0],[64,66],[50,80],[0,80]]],
            A: [[[20,0],[64,0],[64,80],[48,80],[48,58],[16,58],[16,80],[0,80],[0,20]], [[23,16],[48,16],[48,42],[16,42],[16,23]]],
            E: [[[16,0],[64,0],[64,16],[16,16],[16,32],[54,32],[54,48],[16,48],[16,64],[64,64],[64,80],[0,80],[0,16]]],
            N: [[[0,0],[16,0],[48,50],[48,0],[64,0],[64,80],[48,80],[16,30],[16,80],[0,80]]]
          };
          const word = drawLang === "en" ? "EN" : "UA", S = Math.min(1.25, W / 360), gap = 20, gw = 64, slant = .3;
          const totalW = (word.length * gw + (word.length - 1) * gap) * S;
          const ox = W / 2 - totalW / 2 - slant * 40 * S, oy = Hh / 2 - 40 * S;
          shapes = [];
          [...word].forEach((ch, i) => G[ch].forEach(poly => shapes.push(poly.map(([x, y]) =>
            [ox + (i * (gw + gap) + x + slant * (80 - y)) * S, oy + y * S]))));
          strokes = shapes.map(s => [...s, s[0]]);          // замкнені контури для променя
          lab.textContent = drawLang === "en" ? "ENGLISH" : "УКРАЇНСЬКА";
          lab.style.top = `calc(50% + ${Math.round(40 * S + 30)}px)`;
        }
        const segLen = l => l.slice(1).reduce((s, p, i) => s + Math.hypot(p[0] - l[i][0], p[1] - l[i][1]), 0);
        const totalLen = strokes ? strokes.reduce((s, l) => s + segLen(l), 0) : 0;

        const t0 = performance.now(); let alive = true;
        (function draw(now) {
          const t = Math.max(0, now - t0), k = Math.min(t / TOTAL, 1);
          ctx.clearRect(0, 0, W, Hh);
          glowLine();
          if (strokes) {
            // промінь пробігає літери, слід лишається; наприкінці — рівне світіння
            let left = totalLen * Math.min(t / (TOTAL * .62), 1), head = null;
            for (const l of strokes) {
              if (left <= 0) break;
              ctx.beginPath(); ctx.moveTo(l[0][0], l[0][1]);
              for (let i = 1; i < l.length && left > 0; i++) {
                const [x0, y0] = l[i - 1], [x1, y1] = l[i], d = Math.hypot(x1 - x0, y1 - y0), f = Math.min(left / d, 1);
                const x = x0 + (x1 - x0) * f, y = y0 + (y1 - y0) * f;
                ctx.lineTo(x, y); left -= d; head = [x, y];
              }
              ctx.stroke();
            }
            if (head && t < TOTAL * .62) { ctx.fillStyle = "#fff"; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(head[0], head[1], 2.6, 0, 7); ctx.fill(); }
            // після обведення — заливка, як у логотипі
            const fk = Math.min(Math.max((t - TOTAL * .6) / (TOTAL * .22), 0), 1);
            if (fk > 0) {
              ctx.shadowBlur = 0; ctx.globalAlpha = fk; ctx.fillStyle = TXT;
              ctx.beginPath();
              for (const s of shapes) { ctx.moveTo(s[0][0], s[0][1]); for (const p of s.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); }
              ctx.fill("evenodd"); ctx.globalAlpha = 1;
            }
          } else {
            // маленька фігура Ліссажу — сигнал осцилографа
            const grow = Math.min(t / 260, 1), R = 26 * (1 - Math.pow(1 - grow, 3)), cx = W / 2, cy = Hh / 2, ph = t / 520;
            ctx.beginPath();
            for (let i = 0; i <= 160; i++) {
              const u = i / 160 * Math.PI * 2, x = cx + R * Math.sin(2 * u + ph), y = cy + R * Math.sin(3 * u);
              i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
            }
            ctx.stroke();
            lab.textContent = `${T.loading.toUpperCase()}  ${String(Math.round(100 * (1 - Math.pow(1 - k, 2)))).padStart(3, " ")}%`;
          }
          if (alive) requestAnimationFrame(draw);
        })(t0);
        el.classList.add("draw");
        setTimeout(() => {
          el.classList.add("crt-off"); done();
          setTimeout(() => { alive = false; el.remove(); html.classList.remove("loader-active"); }, 520);
        }, TOTAL);
        return;
      }

      // ---- повна: «креслення» логотипа ----
      const svg = $("ld-logo"), pen = $("ld-pen");
      const paths = [...svg.querySelectorAll("path[data-o]")].sort((p, q) => p.dataset.o - q.dataset.o);
      const SPEED = 1.15;      // одиниць логотипа за мс (швидкість пера)
      const HOP = 140;         // мс на переліт пера між частинами
      const toScreen = (p, x, y) => new DOMPoint(x, y).matrixTransform(p.getScreenCTM());
      paths.forEach(p => { const L = p.getTotalLength(); p._L = L; p.style.strokeDasharray = L; p.style.strokeDashoffset = L; });

      // перо рухається як курсор-крапля: тягнеться за ціллю і розтягується від швидкості
      let tx = innerWidth / 2, ty = innerHeight / 2, px = tx, py = ty, penOn = true;
      (function penLoop() {
        const vx = tx - px, vy = ty - py;
        px += vx * .55; py += vy * .55;
        const sp = Math.hypot(vx, vy), ang = Math.atan2(vy, vx);
        pen.style.transform = `translate(${px}px, ${py}px) rotate(${ang}rad) scale(${1 + Math.min(sp / 22, 1.1)}, ${1 - Math.min(sp / 60, .4)})`;
        if (penOn) requestAnimationFrame(penLoop);
      })();

      const wait = ms => new Promise(r => setTimeout(r, ms));
      const tween = (ms, fn) => new Promise(r => {
        const t0 = performance.now();
        (function f(t) { const k = Math.min((t - t0) / ms, 1); fn(k); k < 1 ? requestAnimationFrame(f) : r(); })(t0);
      });
      const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;

      (async () => {
        el.classList.add("draw");
        await wait(380);
        for (const p of paths) {
          const p0 = p.getPointAtLength(0), s = toScreen(p, p0.x, p0.y);
          const fx = tx, fy = ty;
          await tween(HOP, k => { const e = ease(k); tx = fx + (s.x - fx) * e; ty = fy + (s.y - fy) * e; });
          await tween(p._L / SPEED, k => {
            const len = p._L * k, pt = p.getPointAtLength(len), sp2 = toScreen(p, pt.x, pt.y);
            p.style.strokeDashoffset = p._L - len; tx = sp2.x; ty = sp2.y;
          });
        }
        // перо «встановлює» імплант: ховається в крапку над j, логотип заливається
        el.classList.add("filled");
        await wait(140);
        pen.classList.add("gone");
        await wait(420);                        // застигає на мить
        penOn = false;

        // переліт у меню
        const target = document.querySelector(".nav .wordmark").getBoundingClientRect();
        const from = svg.getBoundingClientRect();
        const sc = target.height / from.height;
        svg.style.transformOrigin = "0 0";
        svg.style.transition = "transform .85s cubic-bezier(.7,0,.2,1)";
        svg.style.transform = `translate(${target.left - from.left}px, ${target.top - from.top}px) scale(${sc})`;
        el.classList.add("fly");
        done();
        await wait(870);
        html.classList.add("logo-landed");        // показуємо справжній логотип у меню
        el.classList.add("gone");
        await wait(500);
        el.remove();
        html.classList.remove("loader-draft", "logo-landed", "loader-active");
      })();
    })();

    try {
      const ks = sessionStorage.getItem("keepScroll");
      if (ks !== null) { sessionStorage.removeItem("keepScroll"); requestAnimationFrame(() => scrollTo(0, +ks)); }
      else if (!/^#p-/.test(location.hash)) {
        if (location.hash) history.replaceState(null, "", location.pathname + location.search);
        scrollTo(0, 0);
      }
    } catch (e) {}
  </script>
</body>
</html>
