    // Заставка: перший візит — «креслення» логотипа; перезавантаження / зміна мови — коротке «Завантаження…»
    try {
      const forceIntro = new URLSearchParams(location.search).has("intro"); // ?intro — завжди повна заставка
      const html = document.documentElement;
      if (matchMedia("(prefers-reduced-motion: reduce)").matches && !forceIntro) html.classList.add("no-loader");
      else if (!forceIntro && (sessionStorage.getItem("seenLoader") || window.name === "seenLoader")) html.classList.add("loader-short");
      else html.classList.add("loader-draft");
      // ?intro спрацьовує один раз — прибираємо його з адреси, щоб перезавантаження показувало «Завантаження…»
      if (forceIntro) { const u = new URL(location.href); u.searchParams.delete("intro"); history.replaceState(null, "", u); }
    } catch (e) {}
  </script>

  <script>
    // ---- Мова сайту: збережений вибір → ?lang= → мова браузера ----
    const LANGS = ["uk", "en"];
    let LANG = null;
    try { LANG = localStorage.getItem("lang"); } catch (e) {}
    const qLang = new URLSearchParams(location.search).get("lang");
    if (LANGS.includes(qLang)) LANG = qLang;
    if (!LANGS.includes(LANG)) LANG = /^(uk|ru|be)/i.test(navigator.language || "") ? "uk" : "en";
    var site = LANG === "en" ? site_en : site_uk;

    // Тексти інтерфейсу (заголовки, кнопки). Тексти про тебе — у content.js / content-en.js
    const I18N = {
      uk: {
        nav_projects: "Проєкти", nav_about: "Про мене", nav_exp: "Досвід", nav_faq: "Питання", nav_contact: "Контакти",
        btn_projects: "Дивитись проєкти →", btn_contact: "Зв'язатися",
        h_projects: 'Вибрані <span class="em">проєкти</span>', projects_word: " проєкти · ",
        l_about: "Про мене", l_skills: "Навички та інструменти", h_exp: "Досвід",
        h_reviews: 'Що кажуть <span class="em">клієнти</span>',
        l_faq: "Питання", h_faq: 'Часті <span class="em">питання</span>',
        l_contact: "Контакти", h_contact: 'Давай зробимо<br><span class="em">щось класне</span>',
        cur_view: "Дивитись →", more: "Детальніше", back: "← Усі проєкти", open: "Відкрити проєкт ↗",
        task: "Задача", solution: "Рішення", result: "Результат",
        features: 'Що <span class="em">вміє</span>', next: "Наступний проєкт",
        toast_secret: "🎉 Ти знайшов секретну тему!", toast_back: "Повернулись у звичайний світ 👋",
        themes: ["Сяйво", "Помаранч", "Ніч"], loading: "Завантаження",
        chat: ["Привіт! Хочу забронювати столик на вечір 🙌", "Звісно! На скільки осіб і о котрій?", "Нас 4, о 19:00",
               "Готово ✅ Чекаємо вас о 19:00. Нагадаю за годину!", "Змінити час", "Скасувати"]
      },
      en: {
        nav_projects: "Projects", nav_about: "About", nav_exp: "Experience", nav_faq: "FAQ", nav_contact: "Contact",
        btn_projects: "View projects →", btn_contact: "Get in touch",
        h_projects: 'Selected <span class="em">projects</span>', projects_word: " projects · ",
        l_about: "About me", l_skills: "Skills and tools", h_exp: "Experience",
        h_reviews: 'What <span class="em">clients</span> say',
        l_faq: "FAQ", h_faq: 'Common <span class="em">questions</span>',
        l_contact: "Contact", h_contact: 'Let\'s build<br><span class="em">something great</span>',
        cur_view: "View →", more: "Learn more", back: "← All projects", open: "Open project ↗",
        task: "Challenge", solution: "Solution", result: "Result",
        features: 'What it <span class="em">does</span>', next: "Next project",
        toast_secret: "🎉 You found the secret theme!", toast_back: "Back to the normal world 👋",
        themes: ["Aurora", "Orange", "Night"], loading: "Loading",
        chat: ["Hi! I'd like to book a table for tonight 🙌", "Sure! For how many people and what time?", "4 of us, at 7 pm",
               "Done ✅ See you at 7 pm. I'll remind you an hour before!", "Change time", "Cancel"]
      }
    };
    const T = I18N[LANG];
    document.documentElement.lang = LANG;
    document.querySelectorAll("[data-i18n]").forEach(el => { if (T[el.dataset.i18n] != null) el.innerHTML = T[el.dataset.i18n]; });
    document.querySelectorAll("#themes button").forEach((b, i) => { b.title = T.themes[i]; b.setAttribute("aria-label", T.themes[i]); });
    document.querySelectorAll("#lang button").forEach(b => {
      b.classList.toggle("on", b.dataset.l === LANG);
      b.onclick = () => {
        if (b.dataset.l === LANG) return;
        try { localStorage.setItem("lang", b.dataset.l); sessionStorage.setItem("keepScroll", scrollY); } catch (e) {}
        const u = new URL(location.href); u.searchParams.delete("lang"); u.searchParams.delete("intro");
        // завіса заїжджає знизу, а після перезавантаження заставка «Loading…» їде вгору — виходить один плавний перехід
        const cover = document.createElement("div"); cover.className = "loader cover";
        document.body.appendChild(cover);
        requestAnimationFrame(() => requestAnimationFrame(() => cover.classList.add("in")));
        setTimeout(() => location.replace(u.toString()), 650);
      };
    });
  </script>
  <script>
    // ---- Збирає сторінку з content.js (тут нічого міняти не треба) ----
    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    const pad = i => String(i + 1).padStart(2, "0");
    const finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;

    $("available").textContent = site.available;
    $("intro").textContent = site.intro;
    $("about-text").textContent = site.intro;
    $("foot-name").textContent = "© " + new Date().getFullYear() + " " + site.name;
    $("foot-loc").textContent = site.location;
    $("projects-count").textContent = site.projects.length + T.projects_word + site.role;

    // Анімований заголовок: кожне слово виїжджає знизу по черзі
    const words = site.headline.split(" ");
    $("headline").innerHTML = words.map((w, i) => `<span class="w"><span style="--i:${i}">${esc(w)}</span></span>`).join(" ");
    const afterTitle = (words.length * 70 + 500) / 1000;
    $("intro").style.setProperty("--d", afterTitle + "s");
    $("hero-meta").style.setProperty("--d", (afterTitle + .15) + "s");

    // Біжучий рядок
    const mq = (site.marquee || []).map(m => {
      const t = typeof m === "string" ? { text: m } : m;
      const p = t.project && site.projects.find(x => x.slug === t.project);
      return (p ? `<a href="#p-${esc(p.slug)}" title="${esc(p.title)}">${esc(t.text)}</a>` : `<span>${esc(t.text)}</span>`) + `<i>✦</i>`;
    }).join("");
    $("marquee").innerHTML = [mq, mq, mq, mq].map((h, k) => k ? h.replace(/<a /g, '<a tabindex="-1" ') : h).join("");

    // Лічильники
    $("stats").innerHTML = (site.stats || []).map(s => `
      <div class="stat"><div class="n"><span data-to="${+s.value}">0</span><em>${esc(s.suffix)}</em></div>
      <p>${esc(s.label)}</p></div>`).join("");

    const mock = `<div class="mock"><div class="win"><div class="bar"><i></i><i></i><i></i></div>
      <div class="body"><div class="side"><b></b><b></b><b style="width:70%"></b><b></b></div>
      <div class="main"><b style="width:45%;height:12px"></b><div class="cards"><div></div><div></div><div></div></div>
      <div class="chart"></div><b></b><b style="width:80%"></b></div></div></div></div>`;

    const chatMock = `<div class="mock"><div class="phone"><div class="ph-top"><i></i><div><b></b><b style="width:50%"></b></div></div>
      <div class="msgs"><div class="m in">${T.chat[0]}</div>
      <div class="m out">${T.chat[1]}</div>
      <div class="m in">${T.chat[2]}</div>
      <div class="m out">${T.chat[3]}</div>
      <div class="btns"><span>${T.chat[4]}</span><span>${T.chat[5]}</span></div></div></div></div>`;

    const visual = p => p.image ? `<img src="${esc(p.image)}" alt="${esc(p.title)}">` : (p.mock === "chat" ? chatMock : mock);
    const pills = (p, i) => `
      <span class="num">${pad(i)}</span>
      <span class="pill ${p.live || p.status === 'в розробці' ? 'live' : ''}">${esc(p.status)}</span>
      <span class="pill">${esc(p.year)}</span>`;

    $("projects-list").innerHTML = site.projects.map((p, i) => `
      <a class="project reveal" href="#p-${esc(p.slug)}">
        <div class="info">
          <div class="row">${pills(p, i)}</div>
          <h3>${esc(p.title)}</h3>
          <p>${esc(p.description)}</p>
          <span class="more">${T.more} <b>→</b></span>
          <div class="tags">${(p.tech || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
        </div>
        <div class="visual">${visual(p)}</div>
      </a>`).join('');

    $("skills").innerHTML = site.skills.map(s => `<span>${esc(s)}</span>`).join('');

    $("timeline").innerHTML = site.experience.map(e => `
      <div class="tl-row reveal"><span class="p">${esc(e.period)}</span>
      <span class="t">${esc(e.title)}</span><span class="pl">${esc(e.place)}</span></div>`).join('');

    // Відгуки (секція з'являється, тільки коли є хоч один)
    if ((site.testimonials || []).length) {
      $("reviews").hidden = false;
      $("reviews-list").innerHTML = site.testimonials.map(t => `
        <figure class="review reveal"><span class="q">“</span>
          <blockquote>${esc(t.text)}</blockquote>
          <figcaption><b>${esc(t.name)}</b><span>${esc(t.role)}</span></figcaption></figure>`).join('');
    }

    // FAQ
    $("faq-list").innerHTML = (site.faq || []).map(f => `
      <details class="qa reveal"><summary>${esc(f.q)}<i></i></summary><div class="a"><p>${esc(f.a)}</p></div></details>`).join('');

    const c = site.contacts;
    $("mail").textContent = c.email; $("mail").href = "mailto:" + c.email;
    $("socials").innerHTML = [["GitHub", c.github], ["LinkedIn", c.linkedin], ["Telegram", c.telegram]]
      .filter(([, u]) => u).map(([n, u]) => `<a class="btn magnet" href="${esc(u)}" target="_blank">${n} ↗</a>`).join('');

    // ---- Мобільне меню ----
    $("m-foot").innerHTML = `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` +
      [["GitHub", c.github], ["LinkedIn", c.linkedin], ["Telegram", c.telegram]].filter(([, u]) => u)
        .map(([n, u]) => `<a href="${esc(u)}" target="_blank">${n} ↗</a>`).join("");
    function setMenu(open) {
      document.body.classList.toggle("menu-open", open);
      $("burger").setAttribute("aria-expanded", open);
      $("m-menu").setAttribute("aria-hidden", !open);
    }
    $("burger").onclick = () => setMenu(!document.body.classList.contains("menu-open"));
    document.querySelectorAll("#m-menu a").forEach(a => a.addEventListener("click", () => setMenu(false)));
    addEventListener("keydown", e => e.key === "Escape" && setMenu(false));

    // ---- Сторінка окремого проєкту ----
    function renderProject(p, i) {
      const d = p.details || {};
      const next = site.projects[(i + 1) % site.projects.length];
      $("project-page").innerHTML = `
        <section class="pp">
          <div class="wrap">
            <a href="#projects" class="back">${T.back}</a>
            <div class="row reveal">${pills(p, i)}</div>
            <h1 class="pp-title reveal">${esc(p.title)}</h1>
            <p class="pp-lead reveal">${esc(p.description)}</p>
            <div class="row reveal" style="margin-top:28px">
              <div class="tags" style="padding:0;margin:0">${(p.tech || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
              ${p.link ? `<a class="btn primary magnet" href="${esc(p.link)}" target="_blank">${T.open}</a>` : ''}
            </div>
            <div class="pp-visual reveal">${visual(p)}</div>

            <div class="pp-story">
              ${[[T.task, d.task], [T.solution, d.solution], [T.result, d.result]].filter(([, t]) => t).map(([h, t], k) => `
                <div class="reveal"><span class="label">${pad(k)} — ${h}</span><p>${esc(t)}</p></div>`).join('')}
            </div>

            ${(d.features || []).length ? `
              <div class="sec-head reveal" style="margin-top:110px"><h2>${T.features}</h2></div>
              <div class="features">${d.features.map(f => `<div class="feat reveal"><i>✦</i>${esc(f)}</div>`).join('')}</div>` : ''}

            ${(d.gallery || []).length ? `
              <div class="gallery">${d.gallery.map(src => `<img class="reveal" src="${esc(src)}" alt="">`).join('')}</div>` : ''}

            <a class="next reveal" href="#p-${esc(next.slug)}">
              <span class="label">${T.next}</span>
              <span class="nt">${esc(next.title)} <b>→</b></span>
            </a>
          </div>
        </section>`;
      observeReveal($("project-page"));
    }

    // ---- Навігація між головною і сторінками проєктів ----
    function route() {
      const h = location.hash.slice(1);
      const i = site.projects.findIndex(p => "p-" + p.slug === h);
      const page = i >= 0 ? $("project-page") : $("home");
      if (i >= 0) {
        $("home").hidden = true; $("project-page").hidden = false;
        renderProject(site.projects[i], i);
        document.title = site.projects[i].title + " — " + site.name;
        scrollTo(0, 0);
      } else {
        const wasHidden = $("home").hidden;
        $("home").hidden = false; $("project-page").hidden = true;
        document.title = site.name + " — " + site.role;
        const el = h && document.getElementById(h);
        if (el && wasHidden) requestAnimationFrame(() => el.scrollIntoView());
        if (!wasHidden) return;
      }
      page.classList.remove("page-in"); void page.offsetWidth; page.classList.add("page-in");
    }
    addEventListener("hashchange", () => { route(); $("cur").classList.remove("view", "hover"); });

    // Перехід: картинка проєкту «розгортається» на весь екран
    document.addEventListener("click", e => {
      const card = e.target.closest("a.project");
      if (!card || e.metaKey || e.ctrlKey || e.shiftKey || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      e.preventDefault();
      const v = card.querySelector(".visual"), r = v.getBoundingClientRect();
      const ov = document.createElement("div");
      ov.className = "morph"; ov.innerHTML = v.innerHTML;
      Object.assign(ov.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
      document.body.appendChild(ov);
      ov.getBoundingClientRect();
      Object.assign(ov.style, { left: "0px", top: "0px", width: innerWidth + "px", height: innerHeight + "px", borderRadius: "0px" });
      setTimeout(() => {
        location.hash = card.getAttribute("href");
        requestAnimationFrame(() => {
          const target = document.querySelector(".pp-visual");
          if (!target) return ov.remove();
          target.classList.add("in");
          const t = target.getBoundingClientRect();
          Object.assign(ov.style, { left: t.left + "px", top: t.top + "px", width: t.width + "px", height: t.height + "px", borderRadius: "22px" });
          setTimeout(() => { ov.style.opacity = 0; setTimeout(() => ov.remove(), 300); }, 560);
        });
      }, 560);
    });

    // ---- Теми ----
    const THEMES = ["orb", "block", "glow"];
    let theme = "orb";
    function setTheme(v, save = true) {
      theme = v; document.body.dataset.accent = v;
      const tc = document.querySelector('meta[name="theme-color"]');
      if (tc) tc.content = getComputedStyle(document.body).getPropertyValue("--bg").trim() || "#f6f5f1";
      document.querySelectorAll("#themes button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
      if (save) try { localStorage.setItem("theme", v); } catch (e) {}
    }
    document.querySelectorAll("#themes button").forEach(b => b.onclick = () => setTheme(b.dataset.v));
    let saved = "orb"; try { saved = localStorage.getItem("theme") || "orb"; } catch (e) {}
    const q = new URLSearchParams(location.search).get("theme");
    setTheme(THEMES.includes(q) ? q : (THEMES.includes(saved) ? saved : "orb"), false);

    // ---- Пасхалка: ↑ ↑ ↓ ↓ ← → ← → B A ----
    const KONAMI = ["arrowup","arrowup","arrowdown","arrowdown","arrowleft","arrowright","arrowleft","arrowright","b","a"];
    let kpos = 0, beforeSecret = "orb";
    addEventListener("keydown", e => {
      const k = e.key.toLowerCase(), want = KONAMI[kpos];
      kpos = (k === want || (want === "b" && k === "и") || (want === "a" && k === "ф")) ? kpos + 1 : (k === KONAMI[0] ? 1 : 0);
      if (kpos < KONAMI.length) return;
      kpos = 0;
      if (theme === "secret") { setTheme(beforeSecret, false); toast(T.toast_back); return; }
      beforeSecret = theme; setTheme("secret", false);
      toast(T.toast_secret); confetti();
    });
    function toast(msg) {
      const t = $("toast"); t.textContent = msg; t.classList.add("show");
      clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2600);
    }
    function confetti() {
      const colors = ["#ff2fd0", "#00e5ff", "#ffe600", "#7c4dff", "#00ff9c"];
      for (let i = 0; i < 90; i++) {
        const s = document.createElement("i"); s.className = "confetti";
        s.style.left = Math.random() * 100 + "vw";
        s.style.background = colors[i % colors.length];
        s.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
        s.style.setProperty("--r", (Math.random() * 720 - 360) + "deg");
        s.style.animationDuration = (1.8 + Math.random() * 1.6) + "s";
        s.style.animationDelay = Math.random() * .4 + "s";
        document.body.appendChild(s); setTimeout(() => s.remove(), 4000);
      }
    }

    // ---- «Кібер-імплант»: крапка над j час від часу збоїть і мерехтить ----
    (function implant() {
      const logo = document.querySelector(".logo");
      if (!logo || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const glitch = () => {
        let n = 2 + Math.floor(Math.random() * 4), i = 0;
        (function step() {
          logo.classList.toggle("glitch");
          if (++i < n * 2) setTimeout(step, 40 + Math.random() * 90);
          else { logo.classList.remove("glitch"); setTimeout(glitch, 1200 + Math.random() * 4200); }
        })();
      };
      setTimeout(glitch, 1500);
    })();

    // ---- Ефекти ----
    const nav = $("nav"), prog = $("progress");
    function onScroll() {
      nav.classList.toggle("scrolled", scrollY > 20);
      const max = document.documentElement.scrollHeight - innerHeight;
      prog.style.transform = `scaleX(${max > 0 ? scrollY / max : 0})`;
    }
    addEventListener("scroll", onScroll, { passive: true }); addEventListener("resize", onScroll); onScroll();

    const io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && e.target.classList.add("in")), { threshold: .12 });
    function observeReveal(root) { root.querySelectorAll(".reveal").forEach(el => io.observe(el)); }
    observeReveal(document);

    // Лічильники
    const countIO = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return;
      countIO.unobserve(e.target);
      const el = e.target, to = +el.dataset.to, t0 = performance.now(), dur = 1600;
      (function tick(t) {
        const k = Math.min((t - t0) / dur, 1), ease = 1 - Math.pow(1 - k, 4);
        el.textContent = Math.round(to * ease);
        if (k < 1) requestAnimationFrame(tick);
      })(t0);
    }), { threshold: .6 });
    document.querySelectorAll("[data-to]").forEach(el => countIO.observe(el));

    // Нахил карток проєктів у 3D
    const TILT = 5; // максимальний нахил у градусах
    function tiltAt(x, y, el) {
      const card = el && el.closest && el.closest(".project");
      document.querySelectorAll(".project.tilting").forEach(c => { if (c !== card) { c.classList.remove("tilting"); c.style.transform = ""; } });
      if (!card) return;
      const r = card.getBoundingClientRect();
      const px = (x - r.left) / r.width - .5, py = (y - r.top) / r.height - .5;
      card.classList.add("tilting");
      card.style.transform = `perspective(1200px) rotateX(${-py * TILT}deg) rotateY(${px * TILT}deg) translateY(-4px)`;
    }
    if (finePointer) document.addEventListener("mousemove", e => tiltAt(e.clientX, e.clientY, e.target), { passive: true });

    // Власний курсор: крапля, що розтягується в бік руху
    const CURSOR = "stretch";
    const cur = $("cur");
    if (finePointer) {
      document.documentElement.classList.add("has-cursor");
      document.documentElement.dataset.cursor = CURSOR;
      const shape = cur.querySelector(".cur-shape");
      let mx = -100, my = -100, rx = -100, ry = -100, lastSY = scrollY, moved = false;

      // Магніт: якщо курсор зовсім поруч з кнопкою — він «прилипає» до неї, щоб легше влучити
      const SNAP_ZONE = 26;     // з якої відстані до краю кнопки (px) курсор примагнічує
      const SNAP_FOLLOW = .18;  // наскільки курсор ще ворушиться всередині кнопки (0 — стоїть по центру)
      const SNAP_TARGETS = ".magnet, .nav ul a, .themes button, .lang button, .back, .mail, .socials a, .skills span";
      let snap = null;
      function findSnap(x, y) {
        let best = null, bestD = Infinity;
        document.querySelectorAll(SNAP_TARGETS).forEach(el => {
          const r = el.getBoundingClientRect();
          if (!r.width || !r.height) return;
          const ex = Math.max(r.left - x, 0, x - r.right), ey = Math.max(r.top - y, 0, y - r.bottom);
          const d = Math.hypot(ex, ey);
          if (d <= SNAP_ZONE && d < bestD) { bestD = d; best = { el, cx: r.left + r.width / 2, cy: r.top + r.height / 2 }; }
        });
        if (snap && snap.el !== (best && best.el)) snap.el.classList.remove("snapped");
        snap = best;
        if (snap) snap.el.classList.add("snapped");
      }
      // клік поруч з кнопкою, коли курсор до неї прилип, — натискає кнопку
      addEventListener("click", e => {
        if (!snap || snap.el.contains(e.target)) return;
        if (e.target.closest && e.target.closest("a, button, summary, .project, input, textarea")) return;
        e.preventDefault(); snap.el.click();
      }, true);

      // що зараз під курсором: проєкт → «Дивитись», кнопка/посилання → збільшення
      function stateAt(el) {
        const view = !snap && !!(el && el.closest && el.closest("a.project"));
        cur.classList.toggle("view", view);
        cur.classList.toggle("hover", !!snap || (!view && !!(el && el.closest && el.closest("a, button, summary, .skills span"))));
      }
      addEventListener("mousemove", e => {
        mx = e.clientX; my = e.clientY; moved = true;
        findSnap(mx, my);
        stateAt(e.target);
        document.documentElement.classList.remove("cur-hidden");
      }, { passive: true });

      // прокрутка без руху миші: оновлюємо стан і даємо курсору «відстати», як при русі
      let scrollQueued = false;
      addEventListener("scroll", () => {
        const d = scrollY - lastSY; lastSY = scrollY;
        if (moved) ry -= Math.max(-45, Math.min(45, d * .45));
        if (scrollQueued || !moved) return;
        scrollQueued = true;
        requestAnimationFrame(() => {
          scrollQueued = false;
          const el = document.elementFromPoint(mx, my);
          findSnap(mx, my); stateAt(el); tiltAt(mx, my, el);
        });
      }, { passive: true });

      document.addEventListener("mouseleave", () => document.documentElement.classList.add("cur-hidden"));
      addEventListener("mousedown", () => cur.classList.add("down"));
      addEventListener("mouseup", () => cur.classList.remove("down"));
      (function loop() {
        const ease = snap ? .26 : .22;
        let gx = mx, gy = my;
        if (snap) {
          const r = snap.el.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          gx = cx + (mx - cx) * SNAP_FOLLOW; gy = cy + (my - cy) * SNAP_FOLLOW;
        }
        const vx = gx - rx, vy = gy - ry;
        rx += vx * ease; ry += vy * ease;
        cur.style.translate = `${rx}px ${ry}px`;
        {
          const speed = Math.hypot(vx, vy), ang = Math.atan2(vy, vx);
          const sx = 1 + Math.min(speed / 70, .9), sy = 1 - Math.min(speed / 180, .4);
          shape.style.transform = snap ? "" : `rotate(${ang}rad) scale(${sx}, ${sy})`;
        }
        requestAnimationFrame(loop);
      })();
    }

    // «Сяйво»: куля плавно летить за курсором
    const hero = document.querySelector(".hero"), orb = document.querySelector(".orb");
    let ox = 0, oy = 0, tx = 0, ty = 0, hovering = false;
    const rest = () => { const r = hero.getBoundingClientRect(); return [r.width - orb.offsetWidth * 0.3, r.height / 2]; };
    [ox, oy] = rest();
    hero.addEventListener("mousemove", e => {
      const r = hero.getBoundingClientRect(); hovering = true;
      tx = e.clientX - r.left; ty = e.clientY - r.top;
      hero.style.setProperty("--mx", tx + "px");
      hero.style.setProperty("--my", ty + "px");
    });
    hero.addEventListener("mouseleave", () => hovering = false);
    (function loop() {
      if (!hovering) [tx, ty] = rest();
      ox += (tx - ox) * 0.05; oy += (ty - oy) * 0.05;
      orb.style.translate = `${ox - orb.offsetWidth / 2}px ${oy - orb.offsetHeight / 2}px`;
      requestAnimationFrame(loop);
    })();

    route();

    // ---- Завантажувальний екран: «привіт» різними мовами + лічильник ----
    (function loader() {
      const el = $("loader");
      const html = document.documentElement;
      const done = () => {
        document.body.classList.remove("loading");
        try { sessionStorage.setItem("seenLoader", 1); } catch (e) {}
        try { if (!window.name) window.name = "seenLoader"; } catch (e) {}
      };
      if (html.classList.contains("no-loader")) { el.remove(); done(); return; }

      // ---- коротка: «Завантаження…» ----
      if (html.classList.contains("loader-short")) {
        const total = 750, cnt = $("ld-count");
        $("ld-word").textContent = T.loading;
        const t0 = performance.now();
        (function count(t) {
          const k = Math.min((t - t0) / total, 1);
          cnt.textContent = Math.round(100 * (1 - Math.pow(1 - k, 2)));
          if (k < 1) requestAnimationFrame(count);
        })(t0);
        setTimeout(() => { el.classList.add("out"); done(); setTimeout(() => el.remove(), 1100); }, total + 80);
        return;
      }

      // ---- повна: осцилограф «набирає оберти» і малює j13 зеленим променем ----
      const svg = $("ld-logo"), cv = $("ld-scope"), ctx = cv.getContext("2d");
      const dpr = Math.min(devicePixelRatio || 1, 2);
      cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
      ctx.scale(dpr, dpr);
      const GREEN = "#57ff8c";
      // контур логотипа -> точки на екрані (промінь іде частина за частиною, між ними — «стрибок» без сліду)
      const parts = [...svg.querySelectorAll("path[data-o]")].sort((p, q) => p.dataset.o - q.dataset.o).map(p => {
        const L = p.getTotalLength(), n = Math.max(24, Math.round(L / 3)), m = p.getScreenCTM(), pts = [];
        for (let i = 0; i <= n; i++) { const q = p.getPointAtLength(L * i / n); const s = new DOMPoint(q.x, q.y).matrixTransform(m); pts.push([s.x, s.y]); }
        return pts;
      });
      const route = [];                    // [x, y, draw?]
      parts.forEach(pts => pts.forEach((q, i) => route.push([q[0], q[1], i > 0])));
      const N = route.length;
      const at = f => { const i = ((Math.floor(f) % N) + N) % N, j = (i + 1) % N, t = f - Math.floor(f); const a = route[i], b = route[j]; return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, b[2]]; };

      const wait = ms => new Promise(r => setTimeout(r, ms));
      let pos = 0, last = performance.now(), start = last, running = true, hold = false;
      const RAMP = 2600;                  // мс розгону
      const speedAt = t => 0.012 * Math.pow(160, Math.min(t / RAMP, 1));   // точок за мс: повільно -> дуже швидко
      function frame(now) {
        const dt = Math.max(0, Math.min(now - last, 40)); last = Math.max(now, last);
        const t = Math.max(0, now - start), k = Math.min(t / RAMP, 1);
        // «люмінофор» згасає: що швидше промінь, то довше тримається картинка
        ctx.globalCompositeOperation = "destination-out";
        ctx.fillStyle = `rgba(0,0,0,${hold ? .06 : .16 - .1 * k})`;
        ctx.fillRect(0, 0, innerWidth, innerHeight);
        ctx.globalCompositeOperation = "lighter";
        ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.strokeStyle = GREEN; ctx.shadowColor = GREEN; ctx.shadowBlur = 10 + 8 * k;
        ctx.lineWidth = 1.6 + .8 * k;
        ctx.globalAlpha = hold ? .55 : .5 + .35 * (1 - k);
        const steps = hold ? N : Math.min(speedAt(t) * dt, N * 1.05);
        const from = pos, to = pos + steps;
        ctx.beginPath();
        let prev = at(from); ctx.moveTo(prev[0], prev[1]);
        for (let f = Math.floor(from) + 1; f <= to; f++) {
          const p = at(f);
          if (p[2]) ctx.lineTo(p[0], p[1]); else ctx.moveTo(p[0], p[1]);
        }
        const head = at(to); ctx.lineTo(head[0], head[1]);
        ctx.stroke();
        // яскрава «голова» променя
        if (!hold) {
          ctx.globalAlpha = 1; ctx.shadowBlur = 24; ctx.fillStyle = "#d9ffe6";
          ctx.beginPath(); ctx.arc(head[0], head[1], 2.6 + 1.5 * (1 - k), 0, 7); ctx.fill();
        }
        ctx.globalAlpha = 1;
        pos = to % N;
        if (running) requestAnimationFrame(frame);
      }
      el.classList.add("draw");
      requestAnimationFrame(frame);

      (async () => {
        await wait(RAMP);
        hold = true;                       // оберти максимальні: картинка «стоїть»
        await wait(500);
        el.classList.add("filled");        // логотип заливається, загоряється імплант
        await wait(450);
        running = false;
        el.classList.add("scope-off");
        await wait(250);
        // переліт у меню
        const target = document.querySelector(".nav .wordmark").getBoundingClientRect();
        const from = svg.getBoundingClientRect();
        const sc = target.height / from.height;
        svg.style.transformOrigin = "0 0";
        svg.style.transition = "transform .85s cubic-bezier(.7,0,.2,1)";
        svg.style.transform = `translate(${target.left - from.left}px, ${target.top - from.top}px) scale(${sc})`;
        el.classList.add("fly");
        done();
        await wait(870);
        html.classList.add("logo-landed");
        el.classList.add("gone");
        await wait(500);
        el.remove();
        html.classList.remove("loader-draft", "logo-landed");
      })();
    })();

    try {
      const ks = sessionStorage.getItem("keepScroll");
      if (ks !== null) { sessionStorage.removeItem("keepScroll"); requestAnimationFrame(() => scrollTo(0, +ks)); }
    } catch (e) {}
  </script>
</body>
</html>
